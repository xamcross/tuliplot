spring:
  application:
    name: tuliplot-backend
  mongodb:
    # Prod MONGODB_URI MUST include ?maxPoolSize=50 (shared contract: cap the Mongo pool 20–50).
    # Boot 4 renamed spring.data.mongodb.uri -> spring.mongodb.uri (old name is dead, deprecation level "error").
    uri: ${MONGODB_URI:mongodb://localhost:27017/tuliplot?maxPoolSize=50&minPoolSize=5}
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID:dummy-client-id}
            client-secret: ${GOOGLE_CLIENT_SECRET:dummy-client-secret}
            scope:
              - openid
              - email
              - profile
        provider:
          google:
            authorization-uri: https://accounts.google.com/o/oauth2/v2/auth
            token-uri: https://oauth2.googleapis.com/token
            user-info-uri: https://openidconnect.googleapis.com/v1/userinfo
            user-info-authentication-method: header
            jwk-set-uri: https://www.googleapis.com/oauth2/v3/certs
            user-name-attribute: sub
  # NOTE: no `spring.session.store-type` / `spring.session.mongodb.*` — those were removed with
  # Spring Session's MongoDB module in 4.0 and do not exist on Boot 4.1. Session persistence is the
  # custom MongoSessionRepository wired by SessionConfig (@EnableSpringHttpSession).
  http:
    clients:
      # Bounds every Spring-managed outbound HTTP call (currently: FreemiusGatewayImpl's RestClient).
      # Without this, an unresponsive Freemius endpoint can hang a request thread indefinitely. Set
      # here rather than as a requestFactory(...) call inside FreemiusGatewayImpl because that call
      # would silently replace the mock request factory MockRestServiceServer.bindTo(builder) installs
      # on the same builder in FreemiusGatewayImplTest.
      connect-timeout: 5s
      read-timeout: 10s

server:
  port: 8080

# TulipLot session settings (env-driven). SessionConfig reads these for the session cookie + store;
# SecurityConfig (Task 4 / Plan 02) reads `cookie-domain` + `cookie-secure` for the CSRF cookie.
# Prod sets COOKIE_SECURE=true and COOKIE_DOMAIN=.tuliplot.com.
tuliplot:
  session:
    cookie-name: TULIPSESSION
    cookie-domain: ${COOKIE_DOMAIN:}
    secure: ${COOKIE_SECURE:false}          # session-cookie Secure flag (SessionConfig)
    cookie-secure: ${COOKIE_SECURE:false}   # CSRF-cookie Secure flag (SecurityConfig) — same source
    max-inactive-interval: ${SESSION_TIMEOUT:PT30M}   # ISO-8601 Duration; default 30 minutes
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:https://tuliplot.com,http://localhost:4200}
  oauth2:
    success-url: ${OAUTH2_SUCCESS_URL:https://tuliplot.com/app}
  freemius:
    # Freemius (env-driven; empty defaults keep the app bootable in dev without billing)
    product-id: ${FREEMIUS_PRODUCT_ID:}
    secret-key: ${FREEMIUS_SECRET_KEY:}
    api-token: ${FREEMIUS_API_TOKEN:}
    api-base-url: ${FREEMIUS_API_BASE_URL:https://api.freemius.com/v1}

# AdSense keys (env-driven; empty until AdSense is approved). Relaxed binding maps
# ADSENSE_CLIENT/ADSENSE_SLOT onto adsense.client/adsense.slot.
adsense:
  client: ${ADSENSE_CLIENT:}
  slot: ${ADSENSE_SLOT:}

---
# Local dev profile: `SPRING_PROFILES_ACTIVE=dev ./gradlew bootRun` → local Mongo, insecure cookie.
spring:
  config:
    activate:
      on-profile: dev
  data:
    mongodb:
      uri: mongodb://localhost:27017/tuliplot?maxPoolSize=50&minPoolSize=5
tuliplot:
  session:
    cookie-domain: ""
    secure: false
    cookie-secure: false
