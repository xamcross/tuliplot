app = "api-tuliplot"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[env]
  # fly-proxy terminates TLS; Spring must honor X-Forwarded-Proto or OAuth
  # redirect URIs are built as http:// and Google rejects the mismatch.
  SERVER_FORWARD_HEADERS_STRATEGY = "framework"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "120s"
    method = "GET"
    path = "/api/v1/health"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
